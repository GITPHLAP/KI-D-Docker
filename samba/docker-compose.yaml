services:
  samba:
    image: dockurr/samba
    container_name: samba-test
    ports:
      - 445:445
    volumes:
      - /mnt/samba:/storage
      - container-configs/samba/users.conf:/etc/samba/users.conf
      - ./configs/smb.conf:/etc/samba/smb.conf
    restart: always
volumes:
  container-configs:
    external: true