services:
  config-init:
    image: alpine
    command: >
      sh -c "apk add gettext &&
             envsubst < /templates/users.conf > /config/users.conf" &&
             cp /templates/smb.conf /config/smb.conf
    volumes:
      - ./configs:/templates
      - samba-config:/config
    environment:
      PASS_1: ${PASS_1}
      PASS_2: ${PASS_2}
      PASS_3: ${PASS_3}
      PASS_4: ${PASS_4}
  samba:
    image: dockurr/samba
    container_name: samba-test
    ports:
      - 445:445
    volumes:
      - /mnt/samba:/storage
      - samba-config:/etc/samba
    restart: always
volumes:
  container-configs:
    external: true
  samba-config: