services:
  samba:
    image: dockurr/samba
    container_name: samba
    ports:
      - 445:445
    volumes:
      - /mnt/samba:/storage
      - ./configs/users.template:/configs/users.template:ro
      - ./configs:/etc/samba
      - ./entrypoint.sh:/entrypoint.sh:ro
    restart: always
    entrypoint: ["/entrypoint.sh"]
volumes:
  container-configs:
    external: true