services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      - TZ=Europe/Copenhagen
    volumes:
      - grocy-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.77.0.11
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grocy.entrypoints=websecure"
      - "traefik.http.routers.grocy.tls=true"
      - "traefik.http.routers.grocy.tls.certresolver=le"
      - "traefik.http.services.grocy.loadbalancer.server.port=80"
      - "homepage.group=Apps"
      - "homepage.name=Grocy"
      - "homepage.href=https://grocy.viften.ki-d.dk"
      - "homepage.icon=mdi-checkbox-marked-circle-auto-outline-#337ab7"
      - sablier.enable=true
      - sablier.group=grocy
      - traefik.docker.allownonrunning=true
      - traefik.http.routers.grocy.middlewares=grocy-sablier@file
volumes:
  grocy-config:
networks:
  proxy:
    external: true