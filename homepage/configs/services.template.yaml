- Group A:
  - Home Assistant:
      href: "https://ha.viften.ki-d.dk"
      icon: si-homeassistant-#18BCF2
      widget:
        type: homeassistant
        url: https://ha.viften.ki-d.dk
        key: $HA_TOKEN
  - Proxmox:
      href: "https://proxmox.viften.ki-d.dk"
      icon: si-proxmox-#E57000
      widget:
        type: proxmox
        url: https://proxmox.viften.ki-d.dk
        username: $PROXMOX_TOKEN_ID
        password: $PROXMOX_TOKEN_SECRET
  - Proxmox2:
      href: "https://proxmox2.viften.ki-d.dk"
      icon: si-proxmox-#E57000
      widget:
        type: proxmox
        url: https://proxmox2.viften.ki-d.dk
        username: $PROXMOX2_TOKEN_ID
        password: $PROXMOX2_TOKEN_SECRET
  - Philip Calendar:
      icon: si-googlecalendar-#4285F4
      widget:
        type: calendar
        view: monthly # optional - possible values monthly, agenda
        maxEvents: 10 
        showTime: true 
        timezone: Europe/Copenhagen
        integrations: # optional
          - type: ical # Show calendar events from another service
            url: $PHILIP_SECRET_ICAL # URL with calendar events
            name: Philip # required - name for these calendar events
            color: orange # optional - defaults to pre-defined color for the service (zinc for ical)
            params: # optional - additional params for the service
              showName: true # optional - show name before event title in event line - defaults to false
