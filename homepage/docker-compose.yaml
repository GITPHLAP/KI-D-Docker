services:
  homepage-config-init:
    image: alpine
    container_name: homepage-config-init
    command: >
      sh -c "apk add gettext &&
             envsubst < /templates/services.template.yaml > /config/services.yaml &&
             cp /templates/docker.yaml /config/docker.yaml"
    volumes:
      - ./configs:/templates
      - config:/config
    environment:
      HA_TOKEN: ${HA_TOKEN}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET}
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    # ports:
      # - 3000:3000
    volumes:
      - config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: viften.ki-d.dk # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.77.0.6
    depends_on:
      homepage-config-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.homepage_auth.basicauth.users=${BASIC_AUTH_USERS}
      - traefik.http.routers.homepage.middlewares=homepage_auth
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.tls.certresolver=le
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - traefik.http.routers.homepage.rule=Host(`viften.ki-d.dk`)

volumes:
  config:
networks:
  proxy:
    external: true