
services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls=true"
      - "traefik.http.routers.adguard.tls.certresolver=le"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
      - "homepage.group=Network"
      - "homepage.name=AdGuard"
      - "homepage.href=https://adguard.viften.ki-d.dk"
      - "homepage.icon=si-adguard-#68BC71"
      - homepage.widget.type=adguard
      - homepage.widget.url=https://adguard.viften.ki-d.dk
      - homepage.widget.username=phlap
      - homepage.widget.password=${ADGUARD_PASSWORD}
    ports:
      # Map container ports to host ports
      # Expose port 53 on TCP and UDP for DNS queries
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
      - 8080:80/tcp
      - 3080:3000/tcp
      - 4443:443/tcp
      - 4443:443/udp
      - 853:853/tcp
      - 784:784/udp
      - 853:853/udp
      - 8853:8853/udp
      - 5443:5443/tcp
      - 5443:5443/udp
    volumes:
      - work:/opt/adguardhome/work
      - confdir:/opt/adguardhome/conf
    networks:
      proxy:
        ipv4_address: 172.77.0.5
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.tls.certresolver=le"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - homepage.group=Network
      - homepage.name=Pi-hole
      - homepage.href=https://pihole.viften.ki-d.dk
      - "homepage.icon=si-pihole-#96060C"
      - homepage.widget.type=pihole
      - homepage.widget.url=https://pihole.viften.ki-d.dk
      - homepage.widget.version=6
      - homepage.widget.key=${PIHOLE_PASSWORD}
    environment:
      - TZ=Europe/Copenhagen
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
      # Configure pihole FTL local IP address. Replace 192.168.1.18 with IP address of docker host.
      # - FTLCONF_LOCAL_IPV4=192.168.1.18
      # - DNSSEC=true
      # - DNSMASQ_LISTENING=single
      # # Configure unbound as upstream DNS of pihole. Replace 172.18.0.1 with gateway IP address of docker network. run docker network ls to find network name. run docker inspect <network name> to find getway IP address.
      # - PIHOLE_DNS_=172.18.0.1#5335
    ports:
      - 5353:53/tcp
      - 5353:53/udp
      - 83:80
    volumes:
      - pihole_pihole:/etc/pihole
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.77.0.4
volumes:
  work:
  confdir:
  pihole_pihole:
networks:
  proxy:
    external: true

