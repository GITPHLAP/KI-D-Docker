http:
  serversTransports:
    proxmoxSkipVerify:
      insecureSkipVerify: true
  routers:
    ha:
      entryPoints:
        - websecure
      rule: 'Host(`ha.{{ env "ROOT_DOMAIN" }}`)'
      tls:
        certresolver: le
        
      service: ha
    proxmox:
      entryPoints:
        - websecure
      rule: 'Host(`proxmox.{{ env "ROOT_DOMAIN" }}`)'
      tls:
        certresolver: le
      service: proxmox
    proxmox2:
      entryPoints:
        - websecure
      rule: 'Host(`proxmox2.{{ env "ROOT_DOMAIN" }}`)'
      tls:
        certresolver: le
      service: proxmox2
  services:
    ha:
      loadBalancer:
        servers:
          - url: '{{ env "HA_IP" }}'
    proxmox:
      loadBalancer:
        serversTransport: proxmoxSkipVerify
        servers:
          - url: '{{ env "PROXMOX_IP" }}'
    proxmox2:
      loadBalancer:
        serversTransport: proxmoxSkipVerify
        servers:
          - url: '{{ env "PROXMOX2_IP" }}'
  middlewares:
    homepage-sablier:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: homepage
          sessionDuration: 20m
          ignoreUserAgent: curl
          dynamic:
            displayName: Homepage
            showDetails: true
            theme: hacker-terminal
            refreshFrequency: 5s
    budget-sablier:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: budget
          sessionDuration: 2h
          ignoreUserAgent: curl
          dynamic:
            displayName: Budget
            showDetails: true
            theme: hacker-terminal
            refreshFrequency: 5s
    grocy-sablier:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: grocy
          sessionDuration: 40m
          ignoreUserAgent: curl
          dynamic:
            displayName: Grocy
            showDetails: true
            theme: hacker-terminal
            refreshFrequency: 5s