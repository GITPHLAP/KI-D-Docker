services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Copenhagen
      - CF_API_EMAIL=${CLOUDFLARE_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - HA_IP=${HA_IP}
      - ROOT_DOMAIN=${ROOT_DOMAIN}
      - PROXMOX_IP=${PROXMOX_IP}
    networks:
      proxy:
        ipv4_address: 172.77.0.2
    labels:
      - traefik.enable=true
      - traefik.http.routers.mydashboard.service=api@internal
      - "traefik.http.middlewares.myauth.basicauth.users=${BASIC_AUTH_USERS}"
      - traefik.http.routers.mydashboard.middlewares=myauth
      - traefik.http.routers.mydashboard.entrypoints=websecure
      - traefik.http.routers.mydashboard.tls=true
      - traefik.http.routers.mydashboard.tls.certresolver=le
      - "homepage.group=Platform"
      - "homepage.name=Traefik"
      - "homepage.href=https://traefik.viften.ki-d.dk"
      - "homepage.icon=si:traefik"
      - homepage.widget.type=traefik
      - homepage.widget.url=https://traefik.viften.ki-d.dk
      - homepage.widget.username=admin
      - homepage.widget.password=${TRAEFIK_PASSWORD}
    ports:
      - 80:80 # HTTP entryPoints
      - 443:443 # HTTPS entryPoints
      - 8081:8080 # Dashbaord WebGui 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/certs
      - ./dynamics:/etc/traefik
    dns: 172.77.0.5
volumes:
  certs:
    name: certs

networks:
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.77.0.0/16